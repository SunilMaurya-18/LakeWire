services:
  postgres:
    image: 'postgres:17'
    environment:
      POSTGRES_DB: lakewire
      POSTGRES_USER: lakewire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lakewire -d lakewire']
      interval: 5s
      retries: 10

  redis:
    image: 'redis:7'
    ports:
      - '6379'