name: Bug
description: Something is wrong
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: seed, nemesis flags, client version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LakeWire version / commit
