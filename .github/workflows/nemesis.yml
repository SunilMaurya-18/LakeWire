name: Nemesis

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Temurin 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify smoke
        run: >
          ./mvnw -B -pl verify -am verify
          -Dit.test=VerifySmokeIT
          -Dfailsafe.failIfNoSpecifiedTests=false
          -Dlakewire.verify.smoke.duration=3m

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verify-smoke
          if-no-files-found: ignore
          path: |
            verify/target/verify-smoke/**
            verify/target/failsafe-reports/**

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Temurin 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Nightly 30m
        run: >
          ./mvnw -B -pl verify -am test-compile exec:java
          -Dexec.args="--nemesis kill,pause,partition-pg,slow-s3,pg-restart,retention-storm --duration 30m --seed ${{ github.run_id }} --output verify/target/verify-nightly"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verify-nightly
          if-no-files-found: ignore
          path: verify/target/verify-nightly/**
