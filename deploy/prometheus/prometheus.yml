global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: lakewire-brokers
    metrics_path: /metrics
    static_configs:
      - targets:
          - broker-a:9094
          - broker-b:9094
          - broker-c:9094
        labels:
          cluster: lakewire
  - job_name: lakewire-admin
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - admin:8080
        labels:
          cluster: lakewire
