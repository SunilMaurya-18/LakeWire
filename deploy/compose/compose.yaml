# Dev dependencies for LakeWire v0.1. Copy deploy/compose/.env.example to
# deploy/compose/.env before `docker compose -f deploy/compose/compose.yaml up -d`.
services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/compose/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/compose/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 keeps the data directory under this path, not .../data.
      - lakewire_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    command: ["server", "-s3", "-dir=/data"]
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - lakewire_seaweed:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  seaweed-bucket-init:
    image: chrislusf/seaweedfs:4.54
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"
    environment:
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in deploy/compose/.env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "printf 's3.bucket.create -name %s\\n' \"$$S3_BUCKET\" | weed shell -master=seaweedfs:9333"

volumes:
  lakewire_pg:
  lakewire_seaweed:
